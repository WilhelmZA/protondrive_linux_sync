# neutronsync configuration. Copy to ~/.config/neutronsync/neutronsync.toml
# (or run `neutronsync init`), then edit. See README.md.

[cli]
# Backend defaults to "api", using the packaged sidecar for two-way sync.
# backend = "api"
# Optional sidecar path; default: next to neutronsync, then on PATH.
# sidecar = "/path/to/neutronsync-drive"

# --- Legacy CLI backend (removed in 0.5.0) ---------------------------------
# Set backend = "cli" only as a fallback. Requires a separate proton-drive
# install and sign-in. These keys do nothing on the API backend.
# backend = "cli"
# binary = "proton-drive"
# upload_flags = ["--file-conflict-strategy", "replace", "--folder-conflict-strategy", "replace"]
# download_flags = ["--file-conflict-strategy", "remove", "--folder-conflict-strategy", "remove"]
# fresh_cache = true
# credentials_store = "keychain"
# scan_threads = 8
# download_threads = 4

[options]
# Proton's per-user root. Remote paths in [[pair]] are resolved under this
# unless they start with "/".
remote_root = "/my-files"

# Propagate deletions across sides. When on, a file deleted on one side is
# deleted on the other - but recoverably: the remote copy goes to Proton's
# online trash and the local copy goes to your desktop trash (see local_delete).
# A missing/blank baseline never triggers deletes (first run unions both sides).
propagate_deletes = true

# How a propagated deletion removes the LOCAL copy:
#   trash   send it to the freedesktop trash via `gio` (recoverable)
#   remove  unlink permanently (no recovery)
local_delete = "trash"

# Conflict policy when a file changed on BOTH sides since the last sync:
#   keep-both  keep both versions (local copy is renamed) - never loses data
#   newer      keep whichever has the newer mtime (falls back to keep-both)
#   skip       leave both untouched and warn
conflict = "keep-both"

# How to detect a changed file:
#   size        cheapest; misses a same-size edit
#   size+mtime  reliable - Proton preserves the original mtime (claimedModificationTime)
#   sha1        strictest; hashes local files and compares to Proton's claimedDigests.sha1
compare = "size+mtime"

# API backend: seconds between safety-net full walks (default one day).
# The GUI offers 6 h, 12 h, 1 day and 7 days. Ignored when backend = "cli".
# full_walk_interval = 86400

# Legacy CLI watch pacing (ignored on the API backend):
#   poll_interval - floor for the adaptive full rescan
#   scan_interval - short re-check of "hot" folders
#   debounce - how long a burst of local file events settles before syncing
# poll_interval = 900
# scan_interval = 120
# debounce = 2

# GUI preferences (also toggled from Settings; saved back here automatically).
#   auto_sync    - start the watch daemon on launch and keep it running.
#   run_in_tray  - keep a background tray daemon running (syncs when the window
#                  is closed); the tray opens a window on demand.
#   x11_compat   - render the window via XWayland (the X11 backend) instead of
#                  native Wayland.
# auto_sync = false
# run_in_tray = false
# x11_compat = false

# In-app updater (GUI). It only checks GitHub Releases and notifies you; it
# never downloads or installs anything.
#   update_channel  - "stable" follows releases that have been promoted off
#                     pre-release; "prerelease" follows the newest build.
#   check_on_launch - check quietly when the app starts.
# update_channel = "stable"
# check_on_launch = false

# Add one [[pair]] per folder you want kept in sync. None exist by default;
# uncomment and edit. `auto` (default true) includes the pair when "Auto sync"
# (the watch daemon) is on; set it false to keep a pair manual-only.
# [[pair]]
# name = "documents"
# local = "~/Documents"
# remote = "Documents"        # -> /my-files/Documents
# auto = true
# Sub-paths (relative to this pair) to leave out of sync. Excluded folders are
# ignored entirely and NEVER touched on Proton; the cloud copy always stays.
# exclude = ["APPS", "caches"]

# [[pair]]
# name = "photos"
# local = "~/Pictures"
# remote = "Pictures"
