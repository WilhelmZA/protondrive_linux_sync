name: Security

# Trivy over the source tree and the built image. Results go to the repository's
# Security tab (code scanning); the gate steps fail the run on any HIGH or
# CRITICAL finding that has a fix, and on any secret or Dockerfile
# misconfiguration not accepted in .trivyignore.yaml. Runs weekly as well, so a
# newly published CVE turns the badge red without a code change.

on:
  push:
    branches: [rust]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Trivy
        run: |
          bash scripts/install-trivy.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      # Dependencies from Cargo.lock, sidecar/bun.lock and web/uv.lock, secrets
      # anywhere in the tree, and misconfigurations in the Dockerfile and
      # workflows.
      - name: Scan the source tree (report)
        run: |
          trivy fs --quiet --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml --skip-dirs target,.tools \
            --format sarif -o trivy-source.sarif .

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: trivy-source.sarif
          category: trivy-source

      - name: Gate on the source tree
        run: |
          trivy fs --quiet --scanners vuln,secret,misconfig \
            --ignorefile .trivyignore.yaml --skip-dirs target,.tools \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 .

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build the image (never pushed)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: neutronsync:security
          build-args: |
            NEUTRONSYNC_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy
        run: |
          bash scripts/install-trivy.sh
          echo "$PWD/.tools/bin" >> "$GITHUB_PATH"

      - name: Scan the image (report)
        run: |
          trivy image --quiet --scanners vuln,secret \
            --ignorefile .trivyignore.yaml \
            --format sarif -o trivy-image.sarif neutronsync:security

      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Same gate the release applies before it pushes an image.
      - name: Gate on the image
        run: |
          trivy image --quiet --scanners vuln,secret \
            --ignorefile .trivyignore.yaml \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            neutronsync:security
