name: CI

on:
  push:
    branches: [rust]
  pull_request:
  # Weekly, Monday 05:00 UTC: an advisory published against an unchanged tree
  # still surfaces. Only the deny job runs on this trigger.
  schedule:
    - cron: '0 5 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Sidecar tests, typecheck and audit
        working-directory: sidecar
        run: |
          bun install --frozen-lockfile
          bun test
          bun tests/typecheck.ts
          bun audit --audit-level=high

      - name: Build sidecar
        run: sidecar/build.sh

      # System libraries needed to build the egui/eframe GUI (glow/winit) and
      # the rfd native file dialog.
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libayatana-appindicator3-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Build (lib + CLI)
        run: cargo build --workspace --all-targets

      - name: Build (with GUI and serve)
        run: cargo build --features gui,serve --bins

      - name: Test
        run: cargo test --all-features

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Informational here: CI builds on the runner's newer glibc, so the Rust
      # binaries exceed the floor by design. The release job, which builds
      # inside ubuntu:22.04, enforces it. What this catches early is a Bun or
      # sidecar change that raises neutronsync-drive above 2.35.
      - name: glibc floor of every binary (informational)
        run: |
          scripts/check-glibc.sh 2.35 \
            target/debug/neutronsync \
            target/debug/neutronsync-gui \
            sidecar/dist/neutronsync-drive || true

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync, lint and test
        run: |
          uv sync --locked
          uv run ruff check
          uv run ruff format --check
          uv run pytest

  image:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Build the image (never push)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: neutronsync:ci
          build-args: |
            NEUTRONSYNC_BUILD_SHA=${{ github.sha }}

      - name: Run until healthy
        run: |
          set -euo pipefail
          cfg="$(mktemp -d)"
          data="$(mktemp -d)"
          cid=""
          cleanup() {
            if [ -n "$cid" ]; then docker rm -f "$cid" >/dev/null 2>&1 || true; fi
            rm -rf "$cfg" "$data"
          }
          trap cleanup EXIT
          cid="$(docker run -d \
            --name "neutronsync-ci-$$" \
            -e NEUTRONSYNC_WEB_PASSWORD='ci-test-password-xx' \
            -e PUID="$(id -u)" \
            -e PGID="$(id -g)" \
            -v "$cfg:/config" \
            -v "$data:/data" \
            -p 127.0.0.1::8080 \
            neutronsync:ci)"
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)"
            if [ "$status" = "healthy" ]; then
              echo "healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs "$cid" || true
            fi
            sleep 3
          done
          echo "timed out waiting for healthy" >&2
          docker logs "$cid" || true
          docker inspect "$cid" || true
          exit 1

  # Advisories, licences, bans and sources from deny.toml. Its own job so a new
  # advisory does not hide a test failure, and the only job on the weekly run.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
