name: Release

# Tag a release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail before spending 8 minutes on a build that would ship a release
      # nobody can read. Both of these are things a hurried tag gets wrong.
      - name: Check the tag against Cargo.toml and the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"

          crate="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)"
          if [ "$crate" != "$ver" ]; then
            echo "::error::tag is ${GITHUB_REF_NAME} but Cargo.toml says ${crate}."
            echo "Bump the version and re-tag (scripts/release.sh does both)."
            exit 1
          fi

          if ! grep -qE "^## \[${ver//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section."
            echo "The release body comes from that section, so a release"
            echo "without one says nothing about what changed."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libxdo-dev libayatana-appindicator3-dev

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install and test sidecar
        working-directory: sidecar
        run: |
          bun install --frozen-lockfile
          bun test

      - name: Build sidecar
        run: sidecar/build.sh

      - name: Build release binaries (CLI + GUI)
        run: cargo build --release --features gui --bins

      - name: Strip binaries
        run: strip target/release/neutronsync target/release/neutronsync-gui || true

      - name: Package .deb
        run: cargo deb --no-build --features gui

      - name: Package .rpm
        run: cargo generate-rpm

      - name: Source tarball
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          git archive --format=tar.gz \
            --prefix="neutronsync-${ref}/" \
            -o "dist/neutronsync-${ref}-src.tar.gz" HEAD

      - name: Binary tarball (portable, for the in-app updater)
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          stage="stage/neutronsync-${ref}"
          mkdir -p "$stage"
          cp target/release/neutronsync target/release/neutronsync-gui \
             sidecar/dist/neutronsync-drive \
             README.md LICENSE "$stage/"
          tar -C stage -czf "dist/neutronsync-${ref}-x86_64-linux.tar.gz" "neutronsync-${ref}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm dist/ 2>/dev/null || true
          ls -l dist/

      # Release notes come from CHANGELOG.md, not GitHub's generated commit list:
      # the changelog says what changed and why, the commit list just repeats the
      # subject lines. Pull out the section for this tag's version.
      - name: Release notes from the changelog
        run: |
          mkdir -p dist
          git fetch --tags --force --quiet
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::the '## [${ver}]' section of CHANGELOG.md is empty."
            exit 1
          fi
          prev="$(git tag --sort=-creatordate --list 'v*' \
                  | grep -vFx "$GITHUB_REF_NAME" | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> dist/notes.md
          fi
          echo '--- notes ---'
          cat dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft: the updater skips drafts, so a draft
          # release is invisible to the app until someone publishes it by hand.
          # Pushing a tag is the decision to ship a pre-release.
          draft: false
          # Every tag ships as a pre-release. Promotion to stable is a separate,
          # deliberate decision made once a build has proven itself:
          #   scripts/promote.sh X.Y.Z
          # That release then carries GitHub's "Latest" badge, which only ever
          # sits on one release at a time, and the updater's stable channel
          # starts offering it. The prerelease channel sees every tag as it lands.
          prerelease: true
          # Never move the "Latest" badge onto a fresh build; promotion does that.
          make_latest: false
          name: NeutronSync ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*-x86_64-linux.tar.gz
            dist/*-src.tar.gz
