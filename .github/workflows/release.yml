name: Release

# Tag a release, e.g.:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    # Built inside Ubuntu 22.04 so the binaries need glibc 2.35 at most and
    # start on Ubuntu 22.04, Debian 12 and anything newer. A container, not
    # the ubuntu-22.04 runner image, so the floor stays put when GitHub
    # retires that image.
    container: ubuntu:22.04
    # The steps use bash syntax; say so rather than rely on the runner
    # finding bash in the image.
    defaults:
      run:
        shell: bash
    steps:
      # Before checkout: without git in the container, actions/checkout
      # downloads a tarball with no .git, and the source tarball and release
      # notes steps below need the history.
      - name: Install build tools and GUI build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl git build-essential pkg-config ca-certificates xz-utils unzip gnupg \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcb1-dev libgl1-mesa-dev \
            libayatana-appindicator3-dev

      - uses: actions/checkout@v4

      # The container runs as root but the workspace is owned by the runner
      # user, so git refuses the checkout ("dubious ownership") without this.
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Fail before spending 8 minutes on a build that would ship a release
      # nobody can read. Both of these are things a hurried tag gets wrong.
      - name: Check the tag against Cargo.toml and the changelog
        run: |
          ver="${GITHUB_REF_NAME#v}"

          crate="$(sed -n '/^\[package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -1)"
          if [ "$crate" != "$ver" ]; then
            echo "::error::tag is ${GITHUB_REF_NAME} but Cargo.toml says ${crate}."
            echo "Bump the version and re-tag (scripts/release.sh does both)."
            exit 1
          fi

          if ! grep -qE "^## \[${ver//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${ver}]' section."
            echo "The release body comes from that section, so a release"
            echo "without one says nothing about what changed."
            exit 1
          fi

      # An unsigned release is not a release. The secret reaches the shell
      # only through env, never interpolated into the script.
      - name: Refuse to build a release that cannot be signed
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
        run: |
          if [ -z "$RELEASE_GPG_KEY" ]; then
            echo "::error::the RELEASE_GPG_KEY secret is empty, so this release cannot be signed. docs/RELEASE_SIGNING.md says how to create the key and set the secret."
            exit 1
          fi
          if ! grep -q 'BEGIN PGP PUBLIC KEY BLOCK' packaging/release-signing-key.asc; then
            echo "::error::packaging/release-signing-key.asc is still the placeholder, so no build can verify this release. docs/RELEASE_SIGNING.md says how to commit the public key."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install packagers
        run: cargo install cargo-deb cargo-generate-rpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install and test sidecar
        working-directory: sidecar
        run: |
          bun install --frozen-lockfile
          bun test

      - name: Build sidecar
        run: sidecar/build.sh

      # build.rs reads this first, so a container checkout that git refuses to
      # read can never ship a binary that says "unknown".
      - name: Record the commit being built
        run: echo "NEUTRONSYNC_BUILD_SHA=${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Build release binaries (CLI with serve + GUI)
        run: cargo build --release --features gui,serve --bins

      - name: Strip binaries
        run: strip target/release/neutronsync target/release/neutronsync-gui || true

      - name: Check the glibc floor of every shipped binary
        run: |
          scripts/check-glibc.sh 2.35 \
            target/release/neutronsync \
            target/release/neutronsync-gui \
            sidecar/dist/neutronsync-drive

      - name: Package .deb
        run: cargo deb --no-build --features gui

      - name: Package .rpm
        run: cargo generate-rpm

      - name: Source tarball
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          git archive --format=tar.gz \
            --prefix="neutronsync-${ref}/" \
            -o "dist/neutronsync-${ref}-src.tar.gz" HEAD

      # Complete enough to package from: the AUR package is built from this
      # tarball, so it carries the desktop entry, icons and systemd units in
      # the same layout as the repository.
      - name: Binary tarball (portable, for the in-app updater and the AUR)
        run: |
          mkdir -p dist
          ref="${GITHUB_REF_NAME}"
          stage="stage/neutronsync-${ref}"
          mkdir -p "$stage/packaging" "$stage/assets" "$stage/systemd"
          cp target/release/neutronsync target/release/neutronsync-gui \
             sidecar/dist/neutronsync-drive \
             README.md LICENSE "$stage/"
          cp packaging/neutronsync-gui.desktop "$stage/packaging/"
          cp assets/logo.png assets/neutron-logo.svg "$stage/assets/"
          cp systemd/neutronsync-watch.service systemd/neutronsync.service \
             systemd/neutronsync.timer "$stage/systemd/"
          tar -C stage -czf "dist/neutronsync-${ref}-x86_64-linux.tar.gz" "neutronsync-${ref}"

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/ 2>/dev/null || true
          cp target/generate-rpm/*.rpm dist/ 2>/dev/null || true
          ls -l dist/

      # One checksum list over exactly the four shipped files, signed with the
      # release key. The updater and the AUR package both check this signature
      # against the public keys committed in packaging/, so the secret must be
      # one of those keys; during rotation the file holds the old and the new.
      - name: Write and sign SHA256SUMS
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.deb *.rpm *-x86_64-linux.tar.gz *-src.tar.gz > SHA256SUMS
          if [ "$(wc -l < SHA256SUMS)" -ne 4 ]; then
            echo "::error::SHA256SUMS should list exactly four files:"
            cat SHA256SUMS
            exit 1
          fi
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$RELEASE_GPG_KEY" | gpg --batch --quiet --import
          # The secret's key must be one of the committed public keys, or no
          # installed copy could verify this release.
          secret_fpr="$(gpg --batch --with-colons --list-secret-keys | awk -F: '$1 == "fpr" { print $10; exit }')"
          committed="$(gpg --batch --with-colons --show-keys ../packaging/release-signing-key.asc | awk -F: '$1 == "fpr" { print $10 }')"
          if [ -z "$secret_fpr" ]; then
            echo "::error::RELEASE_GPG_KEY holds no secret key."
            exit 1
          fi
          if ! printf '%s\n' "$committed" | grep -qx "$secret_fpr"; then
            echo "::error::the key in RELEASE_GPG_KEY (${secret_fpr}) is not one of the public keys committed in packaging/release-signing-key.asc, so no installed copy could verify this release. docs/RELEASE_SIGNING.md describes rotation."
            exit 1
          fi
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --quiet \
            --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$secret_fpr" --armor --detach-sign \
            --output SHA256SUMS.asc SHA256SUMS
          rm -rf "$GNUPGHOME"
          echo "signed with ${secret_fpr}"
          cat SHA256SUMS

      # A secret that does not match a committed public key would ship a
      # release no installed copy can verify. Check it here, with a fresh
      # keyring holding only the committed keys (gpg imports every key in
      # the file).
      - name: Verify the signature against the committed public keys
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          gpg --batch --quiet --import packaging/release-signing-key.asc
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$GNUPGHOME"

      # Release notes come from CHANGELOG.md, not GitHub's generated commit list:
      # the changelog says what changed and why, the commit list just repeats the
      # subject lines. Pull out the section for this tag's version.
      - name: Release notes from the changelog
        run: |
          mkdir -p dist
          git fetch --tags --force --quiet
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::the '## [${ver}]' section of CHANGELOG.md is empty."
            exit 1
          fi
          prev="$(git tag --sort=-creatordate --list 'v*' \
                  | grep -vFx "$GITHUB_REF_NAME" | head -1)"
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> dist/notes.md
          fi
          echo '--- notes ---'
          cat dist/notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Published, not a draft: the updater skips drafts, so a draft
          # release is invisible to the app until someone publishes it by hand.
          # Pushing a tag is the decision to ship a pre-release.
          draft: false
          # Every tag ships as a pre-release. Promotion to stable is a separate,
          # deliberate decision made once a build has proven itself:
          #   scripts/promote.sh X.Y.Z
          # That release then carries GitHub's "Latest" badge, which only ever
          # sits on one release at a time, and the updater's stable channel
          # starts offering it. The prerelease channel sees every tag as it lands.
          prerelease: true
          # Never move the "Latest" badge onto a fresh build; promotion does that.
          make_latest: false
          name: NeutronSync ${{ github.ref_name }}
          body_path: dist/notes.md
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*-x86_64-linux.tar.gz
            dist/*-src.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.asc

  # Container image next to the .deb / .rpm. Runs on the runner (not inside the
  # 22.04 build container) so Buildx and cosign work. Tags :<version> and :edge;
  # :latest moves only when the release is promoted (image-promote.yml).
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from the tag
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/wilhelmza/neutronsync:${{ steps.meta.outputs.version }}
            ghcr.io/wilhelmza/neutronsync:edge
          build-args: |
            NEUTRONSYNC_BUILD_SHA=${{ steps.meta.outputs.sha_short }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1

      - name: Sign the image by digest (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/wilhelmza/neutronsync@${DIGEST}"
