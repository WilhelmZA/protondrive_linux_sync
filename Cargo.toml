[package]
name = "neutronsync"
version = "0.3.3"
edition = "2021"
description = "Bidirectional Proton Drive folder sync built on the official proton-drive CLI"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WilhelmZA/protondrive_linux_sync"
homepage = "https://github.com/WilhelmZA/protondrive_linux_sync"

# Library core (reused by the CLI now, and a GUI later) + a thin CLI binary.
[lib]
name = "neutronsync"
path = "src/lib.rs"

[[bin]]
name = "neutronsync"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
walkdir = "2"
anyhow = "1"
tempfile = "3"
eframe = { version = "0.35", optional = true }
egui-phosphor = { version = "0.13", optional = true, default-features = false, features = ["regular"] }
rfd = { version = "0.17.2", optional = true }
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
winit = { version = "0.30", optional = true }
tray-icon = { version = "0.24", optional = true }
gtk = { version = "0.18", optional = true }
# In-app updates (GUI-only): tiny HTTP client, semver compare, and SHA-256 to
# verify a downloaded package against the digest the release API publishes.
ureq = { version = "2", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }

[profile.release]
opt-level = "z"   # optimise for size ("lite")
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# The GUI is opt-in so the CLI stays dependency-light:
#   cargo run --features gui --bin neutronsync-gui
gui = [
    "dep:eframe",
    "dep:rfd",
    "dep:egui-phosphor",
    "dep:winit",
    "dep:tray-icon",
    "dep:gtk",
    "dep:ureq",
    "dep:semver",
    "dep:sha2",
]

[[bin]]
name = "neutronsync-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

# --- Packaging -------------------------------------------------------------
# Built by .github/workflows/release.yml on a v* tag. Both packages ship the
# CLI, the GUI, the .desktop entry, and the systemd --user units. The GUI
# binary is one of the assets, so packaging requires the `gui` feature:
#   cargo deb --features gui         &&   cargo generate-rpm
# proton-drive is a runtime prerequisite (not in distro repos) - see README.
[package.metadata.deb]
maintainer = "Wilhelm Schonfeldt"
copyright = "2026 Wilhelm Schonfeldt"
section = "utils"
priority = "optional"
depends = "$auto, libgl1, libxkbcommon0"
extended-description = """\
Bidirectional Proton Drive folder sync built on the official proton-drive CLI. \
Ships a CLI (neutronsync) and a native GUI (neutronsync-gui). Requires the \
proton-drive CLI to be installed separately."""
assets = [
    ["target/release/neutronsync", "usr/bin/", "755"],
    ["target/release/neutronsync-gui", "usr/bin/", "755"],
    ["packaging/neutronsync-gui.desktop", "usr/share/applications/", "644"],
    ["assets/logo.png", "usr/share/icons/hicolor/256x256/apps/neutronsync.png", "644"],
    ["assets/neutron-logo.svg", "usr/share/icons/hicolor/scalable/apps/neutronsync.svg", "644"],
    ["systemd/neutronsync-watch.service", "usr/lib/systemd/user/", "644"],
    ["systemd/neutronsync.service", "usr/lib/systemd/user/", "644"],
    ["systemd/neutronsync.timer", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/neutronsync/README.md", "644"],
    ["LICENSE", "usr/share/doc/neutronsync/LICENSE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/neutronsync", dest = "/usr/bin/neutronsync", mode = "755" },
    { source = "target/release/neutronsync-gui", dest = "/usr/bin/neutronsync-gui", mode = "755" },
    { source = "packaging/neutronsync-gui.desktop", dest = "/usr/share/applications/neutronsync-gui.desktop", mode = "644" },
    { source = "assets/logo.png", dest = "/usr/share/icons/hicolor/256x256/apps/neutronsync.png", mode = "644" },
    { source = "assets/neutron-logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/neutronsync.svg", mode = "644" },
    { source = "systemd/neutronsync-watch.service", dest = "/usr/lib/systemd/user/neutronsync-watch.service", mode = "644" },
    { source = "systemd/neutronsync.service", dest = "/usr/lib/systemd/user/neutronsync.service", mode = "644" },
    { source = "systemd/neutronsync.timer", dest = "/usr/lib/systemd/user/neutronsync.timer", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/neutronsync/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/neutronsync/LICENSE", mode = "644" },
]
