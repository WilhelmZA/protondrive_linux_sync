[package]
name = "neutronsync"
version = "0.9.2"
edition = "2021"
description = "Bidirectional Proton Drive folder sync with a built-in API sidecar"
license = "MIT"
readme = "README.md"
repository = "https://github.com/WilhelmZA/protondrive_linux_sync"
homepage = "https://github.com/WilhelmZA/protondrive_linux_sync"

# Library core (reused by the CLI now, and a GUI later) + a thin CLI binary.
[lib]
name = "neutronsync"
path = "src/lib.rs"

[[bin]]
name = "neutronsync"
path = "src/main.rs"

[dev-dependencies]
libc = "0.2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha1_smol = "1"
walkdir = "2"
anyhow = "1"
libc = "0.2"
rpassword = "7"
tempfile = "3"
eframe = { version = "0.35", optional = true }
egui-phosphor = { version = "0.13", optional = true, default-features = false, features = ["regular"] }
rfd = { version = "0.17.2", optional = true }
notify-debouncer-full = "0.7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
winit = { version = "0.30", optional = true }
# Without the default `libxdo` feature: it only serves muda's predefined
# copy/paste items, which the tray menu does not use, and it ties the GUI to
# libxdo.so.3, which Arch no longer ships.
tray-icon = { version = "0.24", optional = true, default-features = false, features = ["gtk"] }
gtk = { version = "0.18", optional = true }
# In-app updates (GUI-only): tiny HTTP client, semver compare, and SHA-256 to
# verify a downloaded package against the digest the release API publishes.
ureq = { version = "2", optional = true }
semver = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
# Verifies the release's signed checksum list in-process, so an update is
# checked against NeutronSync's release key without depending on the user's
# gpg or keyring. Pure Rust; bzip2 (the only default feature) is not needed.
pgp = { version = "0.21", optional = true, default-features = false }
# PNG encoder for `neutronsync-gui --screenshots <dir>` (documentation captures).
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
# `neutronsync serve` (serve feature only): the HTTP API, its event stream,
# and the OpenAPI document. Auth, body limits and error mapping live in
# src/server. Without the feature none of these crates is compiled in.
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "query", "http1", "tokio"] }
# 1.54.1 fixes the Interval timer race in the yanked 1.54.0 release.
tokio = { version = "1.54.1", optional = true, features = ["rt-multi-thread", "net", "macros", "signal", "time", "sync"] }
tokio-stream = { version = "0.1", optional = true, features = ["sync"] }
# OpenAPI 3.1 for /api/v1. Pinned: docs/openapi.json is generated from these
# macros, and a newer utoipa can change the JSON without an API change.
utoipa = { version = "=6.0.0", optional = true }

[profile.release]
opt-level = "z"   # optimise for size ("lite")
lto = true
strip = true
codegen-units = 1
panic = "abort"

[features]
# The GUI is opt-in so the CLI stays dependency-light. It includes `serve`:
# the tray hosts the same `/api/v1` server as `neutronsync serve`.
#   cargo run --features gui --bin neutronsync-gui
gui = [
    "serve",
    "dep:eframe",
    "dep:rfd",
    "dep:egui-phosphor",
    "dep:winit",
    "dep:tray-icon",
    "dep:gtk",
    "dep:ureq",
    "dep:semver",
    "dep:sha2",
    "dep:pgp",
    "dep:image",
]
# `neutronsync serve`: the headless HTTP API. Opt-in for the same reason as
# the GUI; the release build enables it so the packages ship a CLI that can
# serve:
#   cargo build --features serve
serve = ["dep:axum", "dep:tokio", "dep:tokio-stream", "dep:utoipa"]

[[bin]]
name = "neutronsync-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

# Prints the OpenAPI document. Not a product binary: release packaging copies
# neutronsync and neutronsync-gui by name. `cargo build --bins` does not build
# examples, so this stays out of that list.
[[example]]
name = "openapi"
required-features = ["serve"]

# --- Packaging -------------------------------------------------------------
# Built by .github/workflows/release.yml on a v* tag. Both packages ship the
# CLI, the GUI, the .desktop entry, and the systemd --user units. The GUI
# binary is one of the assets, so packaging requires the `gui` feature:
#   cargo deb --features gui         &&   cargo generate-rpm
[package.metadata.deb]
maintainer = "Wilhelm Schonfeldt"
copyright = "2026 Wilhelm Schonfeldt"
section = "utils"
priority = "optional"
depends = "$auto, libgl1, libxkbcommon0, libsecret-tools"
extended-description = """\
Bidirectional Proton Drive folder sync with a built-in API sidecar. \
Ships a CLI (neutronsync), native GUI (neutronsync-gui) and neutronsync-drive."""
assets = [
    ["target/release/neutronsync", "usr/bin/", "755"],
    ["target/release/neutronsync-gui", "usr/bin/", "755"],
    ["sidecar/dist/neutronsync-drive", "usr/bin/", "755"],
    ["packaging/neutronsync-gui.desktop", "usr/share/applications/", "644"],
    ["assets/logo.png", "usr/share/icons/hicolor/256x256/apps/neutronsync.png", "644"],
    ["assets/neutron-logo.svg", "usr/share/icons/hicolor/scalable/apps/neutronsync.svg", "644"],
    ["systemd/neutronsync-watch.service", "usr/lib/systemd/user/", "644"],
    ["systemd/neutronsync.service", "usr/lib/systemd/user/", "644"],
    ["systemd/neutronsync.timer", "usr/lib/systemd/user/", "644"],
    ["README.md", "usr/share/doc/neutronsync/README.md", "644"],
    ["LICENSE", "usr/share/doc/neutronsync/LICENSE", "644"],
]

[package.metadata.generate-rpm]
# Dependencies are declared below, not scanned: without rpm-build's
# find-requires on the build host, cargo-generate-rpm's own scan emits
# requires no repository satisfies (libc.so.6(GLIBC_2.18)[WEAK](64bit)).
auto-req = "no"
assets = [
    { source = "target/release/neutronsync", dest = "/usr/bin/neutronsync", mode = "755" },
    { source = "target/release/neutronsync-gui", dest = "/usr/bin/neutronsync-gui", mode = "755" },
    { source = "sidecar/dist/neutronsync-drive", dest = "/usr/bin/neutronsync-drive", mode = "755" },
    { source = "packaging/neutronsync-gui.desktop", dest = "/usr/share/applications/neutronsync-gui.desktop", mode = "644" },
    { source = "assets/logo.png", dest = "/usr/share/icons/hicolor/256x256/apps/neutronsync.png", mode = "644" },
    { source = "assets/neutron-logo.svg", dest = "/usr/share/icons/hicolor/scalable/apps/neutronsync.svg", mode = "644" },
    { source = "systemd/neutronsync-watch.service", dest = "/usr/lib/systemd/user/neutronsync-watch.service", mode = "644" },
    { source = "systemd/neutronsync.service", dest = "/usr/lib/systemd/user/neutronsync.service", mode = "644" },
    { source = "systemd/neutronsync.timer", dest = "/usr/lib/systemd/user/neutronsync.timer", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/neutronsync/README.md", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/neutronsync/LICENSE", mode = "644" },
]

# Fedora package names. glibc >= 2.35 is the floor the release build has
# (built inside ubuntu:22.04), so the package refuses to install where it
# could not start.
[package.metadata.generate-rpm.requires]
glibc = ">= 2.35"
gtk3 = "*"
libxkbcommon = "*"
mesa-libGL = "*"
libsecret = "*"
libayatana-appindicator-gtk3 = "*"
